name: CI

# Public, checkable evidence for the validation claims in the README. Builds and tests what a clean clone contains. Left out:
# the benchmark and Pomelo comparison projects (a Pomelo checkout beside the repository), the DuckDB plugin and the specification
# suite (a DuckDB.NET checkout beside the repository).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core (no database servers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore src/pengdows.efcore.adonet/pengdows.efcore.adonet.csproj
      - run: dotnet build src/pengdows.efcore.adonet/pengdows.efcore.adonet.csproj --no-restore
      - run: dotnet test test/pengdows.efcore.adonet.Tests --no-restore

  providers:
    name: Provider ${{ matrix.provider }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: sqlite
            project: test/pengdows.efcore.adonet.sqlite.Tests
          - provider: flatfile
            project: test/pengdows.efcore.adonet.flatfile.Tests
          - provider: sqlserver
            project: test/pengdows.efcore.adonet.sqlserver.Tests
          - provider: mysql
            project: test/pengdows.efcore.adonet.mysql.Tests
          - provider: postgresql
            project: test/pengdows.efcore.adonet.postgresql.Tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Server-backed suites start their database with Testcontainers, which needs the Docker daemon on the runner.
      - run: dotnet test ${{ matrix.project }}

  # The EF Core specification suite is not in CI yet: it references the DuckDB plugin, which needs a DuckDB.NET checkout
  # beside this repository, and it runs every configured provider. Run it locally with: dotnet test test/pengdows.efcore.adonet.Specification.Tests

  outside-plugin:
    name: Outside plugin (packed core, no InternalsVisibleTo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # The sample is built against this package alone: it proves an assembly outside the repository can plug in.
      - run: dotnet pack src/pengdows.efcore.adonet/pengdows.efcore.adonet.csproj -c Release -p:Version=0.0.0-outside.1 -o artifacts/packages
      - run: dotnet run --project test/pengdows.efcore.adonet.OutsidePluginSample
